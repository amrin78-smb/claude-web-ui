# Build the installers and publish them as a GitHub Release.
#
# The release is also the update feed: a packaged install asks
# /releases/latest which version is current and which asset matches its target
# (see installMode/checkRelease in server/update.js). So publishing a release
# here is what makes "Update app" work for .exe and .deb installs.
#
# Trigger by pushing a v-tag:  git tag v2.1.0 && git push origin v2.1.0
# or run it manually from the Actions tab to get artifacts without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build .deb (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Stage the Linux tree
        run: node scripts/package.js --target linux-x64

      - name: Build the .deb
        run: node scripts/build-deb.js --stage dist-pkg/linux-x64 --out dist-pkg

      # dpkg is native here, so let it have the final word on whether the
      # hand-built ar archive is a valid package.
      - name: Verify with dpkg
        run: |
          set -e
          deb=$(ls dist-pkg/*.deb)
          echo "Verifying $deb"
          dpkg-deb --info "$deb"
          # Write --contents to a file before grepping: `grep -q` exits on the
          # first match and closes the pipe, which kills dpkg-deb's tar with
          # EPIPE and prints an alarming "tar subprocess returned error".
          dpkg-deb --contents "$deb" > contents.txt
          grep -q 'opt/claude-web-ui/server/index.js' contents.txt
          # Install with apt, not `dpkg -i`: setup-node puts node in the runner
          # tool cache, which does not satisfy `Depends: nodejs (>= 18)`, so dpkg
          # unpacks but refuses to configure. Going through apt pulls the archive
          # nodejs in and so also proves that dependency is satisfiable on stock
          # Ubuntu -- something `--force-depends` would have hidden.
          sudo apt-get update
          sudo apt-get install -y "./$deb"
          claude-web-ui &
          for i in $(seq 1 20); do
            sleep 1
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4280/ || true)
            [ "$code" = "200" ] && { echo "server answered 200"; exit 0; }
          done
          echo "packaged app never answered on 4280" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist-pkg/*.deb

  windows:
    name: Build .exe installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - run: npm ci

      - name: Stage the Windows tree
        run: node scripts/package.js --target win32-x64

      # windows-latest ships Chocolatey; Inno Setup is not preinstalled.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DStageDir=$PWD\dist-pkg\win32-x64" "/DAppVersion=$version" `
                  "packaging\windows\claude-web-ui.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist-pkg\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist-pkg/*.exe

  release:
    name: Publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/deb/*.deb
            artifacts/exe/*.exe
          generate_release_notes: true
